<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Libertad Este · Prueba Funcional R1</title>
<style>
:root{--nav:#132238;--nav2:#1b304b;--accent:#d81b82;--bg:#f3f6fa;--card:#fff;--text:#1e293b;--muted:#64748b;--line:#dbe3ec;--ok:#16834a;--warn:#b77900;--danger:#b42318;--blue:#2463eb}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{height:76px;background:linear-gradient(90deg,#0d1b2a,#1e3552);color:#fff;display:flex;align-items:center;padding:0 22px;gap:16px}
.crest{width:48px;height:48px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-weight:800}
.head h1{margin:0;font-size:19px}.head small{opacity:.75}
.role{margin-left:auto;display:flex;gap:8px;align-items:center}.role button{border:1px solid #55708e;background:transparent;color:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}.role button.active{background:var(--accent);border-color:var(--accent)}
.app{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 76px)}
aside{background:var(--nav);color:#d8e2ed;padding:15px 10px}.section{font-size:11px;text-transform:uppercase;color:#7f9ab5;margin:18px 10px 7px}.nav{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;color:#d8e2ed;padding:11px 12px;border-radius:8px;text-align:left;cursor:pointer}.nav:hover,.nav.active{background:var(--nav2);color:#fff}.nav.active{border-left:3px solid var(--accent)}
main{padding:22px;overflow:auto}.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.title h2{margin:0 0 4px}.muted{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 2px 8px #1322380b}.metric b{font-size:27px;display:block}.metric span{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#eef2f7;color:#475569}.b-ok{background:#e8f7ef;color:#11743f}.b-warn{background:#fff4d8;color:#9a6700}.b-blue{background:#eaf0ff;color:#2456bd}.b-pink{background:#fde8f3;color:#b21668}
button.primary,button.secondary,button.danger{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}button.primary{background:var(--accent);color:#fff}button.secondary{background:#e9eef5;color:#203047}button.danger{background:#fee4e2;color:#9d241b}
.actions{display:flex;gap:8px;flex-wrap:wrap}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}th{font-size:11px;text-transform:uppercase;color:#64748b;background:#f8fafc}
input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:9px;background:#fff;font:inherit}textarea{min-height:86px;resize:vertical}label{font-size:12px;font-weight:700;color:#475569;display:block;margin-bottom:5px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.full{grid-column:1/-1}
.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:15px}.tab{border:0;background:transparent;padding:10px 13px;cursor:pointer;color:#64748b}.tab.active{color:var(--accent);border-bottom:2px solid var(--accent);font-weight:700}
.notice{padding:11px 13px;border-radius:8px;background:#edf4ff;border:1px solid #c9dcff;color:#234b89;font-size:13px;margin-bottom:12px}.success{background:#eaf8ef;border-color:#bfe7cc;color:#176b3d}.warning{background:#fff7df;border-color:#efd58a;color:#795800}
.hidden{display:none!important}.toast{position:fixed;right:22px;bottom:22px;z-index:20;background:#16263b;color:#fff;padding:12px 16px;border-radius:9px;box-shadow:0 8px 30px #0003;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}
.timeline{border-left:3px solid #d9e1eb;margin:8px 0 0 8px;padding-left:16px}.event{margin:0 0 14px}.event b{font-size:13px}.event small{display:block;color:#64748b}
.filebox{border:2px dashed #cbd5e1;border-radius:9px;padding:16px;text-align:center;color:#64748b}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid,.grid2{grid-template-columns:1fr}.app{grid-template-columns:190px 1fr}}
</style>
</head>
<body>
<header>
<div class="crest">LLE</div><div class="head"><h1>Alcaldía Municipal de La Libertad Este</h1><small>Gerencia Ambiental y Gestión de Riesgo · Sistema Digital de Inspecciones Ambientales</small></div>
<div class="role"><span>Modo prueba:</span><button id="techBtn" class="active" onclick="setRole('TECNICO')">Técnico</button><button id="mgrBtn" onclick="setRole('GERENTE')">Gerente</button></div>
</header>
<div class="app">
<aside id="side"></aside><main id="main"></main>
</div>
<div id="toast" class="toast"></div>
<script>
const KEY='LLE_PRUEBA_FUNCIONAL_R1';
const seed={version:'R1-FUNCIONAL-UI',seq:1,expedientes:[{
 id:'EXP-2026-0001',solicitante:'María López',telefono:'7000-0000',distrito:'Antiguo Cuscatlán',tipo:'Poda/Tala',intervencion:'Tala en proceso constructivo',direccion:'Colonia La Sultana, Antiguo Cuscatlán',lat:'13.6792',lon:'-89.2381',
 status:'Asignada a técnico',tecnico:'Técnico Ambiental 01',acta:{},informe:{},arboles:[{id:1,especie:'Ciprés',altura:'12',diametro:'42',estado:'Regular',recomendacion:'Tala',accion:'Tala autorizable'}],evidencias:[],validacion:{},tramite:null,events:[{t:'Asignación',d:'Expediente asignado al Técnico Ambiental 01'}]
},{id:'EXP-2026-0002',solicitante:'Comercial XYZ, S.A.',telefono:'2222-2222',distrito:'Huizúcar',tipo:'Denuncia por vertidos',intervencion:'Inspección por denuncia',direccion:'Barrio El Centro, Huizúcar',lat:'13.5890',lon:'-89.2380',status:'Asignada a técnico',tecnico:'Técnico Ambiental 01',acta:{},informe:{},arboles:[],evidencias:[],validacion:{},tramite:null,events:[]}]};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed; let role='TECNICO', section='inicio', eid=db.expedientes[0].id, tab='resumen';
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function toast(m,ok=true){const e=document.getElementById('toast');e.textContent=m;e.className='toast show';setTimeout(()=>e.className='toast',2400)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function current(){return db.expedientes.find(x=>x.id===eid)||db.expedientes[0]}
function event(x,title,detail){x.events.unshift({t:title,d:detail});}
function setRole(r){role=r;document.getElementById('techBtn').classList.toggle('active',r==='TECNICO');document.getElementById('mgrBtn').classList.toggle('active',r==='GERENTE');section='expedientes';render()}
function nav(s){section=s; if(s==='expedientes')eid=db.expedientes[0].id; render()}
function side(){let base=[['inicio','⌂','Inicio'],['expedientes','▣','Expedientes'],['solicitudes','＋','Solicitudes / Denuncias'],['asignaciones','⇄','Asignaciones'],['inspecciones','⌖','Inspecciones'],['actas','▤','Actas'],['informes','▤','Informes']]; if(role==='GERENTE')base.push(['validacion','✓','Validación'],['tramites','▤','Permisos / Servicios'],['recibos','▣','Recibos'],['documentos','▤','Documentos finales']); return '<div class="section">Operación</div>'+base.map(a=>'<button class="nav '+(section===a[0]?'active':'')+'" onclick="nav(\''+a[0]+'\')">'+a[1]+' '+a[2]+'</button>').join('')+'<div class="section">Control</div><button class="nav" onclick="resetDemo()">↻ Restablecer prueba</button><button class="nav" onclick="exportData()">⇩ Exportar datos</button>'}
function render(){document.getElementById('side').innerHTML=side();let m=document.getElementById('main');try{m.innerHTML=page()}catch(e){m.innerHTML='<div class="card"><h2>Error de interfaz</h2><pre>'+esc(e.stack)+'</pre></div>'}}
function page(){if(section==='inicio')return dashboard();if(section==='expedientes'||section==='solicitudes'||section==='asignaciones')return listPage();if(section==='inspecciones'||section==='actas'||section==='informes'||section==='validacion'||section==='tramites'||section==='recibos'||section==='documentos')return expedientePage();return dashboard()}
function dashboard(){let es=db.expedientes;return '<div class="topbar"><div class="title"><h2>Panel de '+(role==='TECNICO'?'Técnico':'Gerente')+'</h2><div class="muted">Prueba funcional real de interfaz · persistencia local del navegador</div></div><button class="primary" onclick="newRequest()">+ Nueva solicitud</button></div><div class="grid"><div class="card metric"><b>'+es.length+'</b><span>Expedientes</span></div><div class="card metric"><b>'+es.filter(x=>x.tipo==='Poda/Tala').length+'</b><span>Poda/Tala</span></div><div class="card metric"><b>'+es.filter(x=>x.status.includes('validación')).length+'</b><span>En validación</span></div><div class="card metric"><b>'+es.filter(x=>x.tramite).length+'</b><span>Documentos generados</span></div></div><div style="height:16px"></div><div class="card"><div class="between"><h3>Expedientes recientes</h3><button class="secondary" onclick="nav('expedientes')">Ver todos</button></div>'+tableExp(es.slice(0,5))+'</div>'}
function tableExp(es){return '<table><thead><tr><th>Expediente</th><th>Solicitante</th><th>Distrito</th><th>Tipo</th><th>Estado</th><th></th></tr></thead><tbody>'+es.map(x=>'<tr><td><b>'+esc(x.id)+'</b></td><td>'+esc(x.solicitante)+'</td><td>'+esc(x.distrito)+'</td><td>'+esc(x.tipo)+'</td><td>'+badge(x.status)+'</td><td><button class="secondary" onclick="openExp(\''+x.id+'\')">Abrir</button></td></tr>').join('')+'</tbody></table>'}
function badge(s){let c=s.includes('validación')?'b-warn':s.includes('generado')||s==='Cerrado'?'b-ok':s.includes('Asignada')?'b-blue':'b-pink';return '<span class="badge '+c+'">'+esc(s)+'</span>'}
function listPage(){return '<div class="topbar"><div><h2>Expedientes</h2><div class="muted">Cada expediente abre un flujo real de prueba.</div></div><button class="primary" onclick="newRequest()">+ Nueva solicitud</button></div><div class="card">'+tableExp(db.expedientes)+'</div>'}
function openExp(id){eid=id;tab='resumen';section='expedientes';render()}
function expedientePage(){let x=current();return '<div class="topbar"><div><h2>'+esc(x.id)+'</h2><div class="muted">'+esc(x.tipo)+' · '+esc(x.distrito)+' · '+esc(x.solicitante)+'</div></div><div class="row">'+badge(x.status)+'<button class="secondary" onclick="nav('expedientes')">← Bandeja</button></div></div>'+tabs(x)+'<div>'+tabContent(x)+'</div>'}
function tabs(x){let a=[['resumen','Expediente'],['acta','Acta'],['arboles','Árboles'],['evidencias','Evidencias'],['informe','Informe'],['traza','Trazabilidad']];if(role==='GERENTE'&&x.tipo==='Poda/Tala')a.push(['economico','Permiso / Tasas / Recibo']);return '<div class="tabs">'+a.map(z=>'<button class="tab '+(tab===z[0]?'active':'')+'" onclick="tab=\''+z[0]+'\';render()">'+z[1]+'</button>').join('')+'</div>'}
function tabContent(x){if(tab==='resumen')return resumen(x);if(tab==='acta')return acta(x);if(tab==='arboles')return arboles(x);if(tab==='evidencias')return evidencias(x);if(tab==='informe')return informe(x);if(tab==='traza')return traza(x);return economico(x)}
function resumen(x){return '<div class="grid2"><div class="card"><h3>Datos de solicitud</h3><div class="formgrid"><div><label>Solicitante</label><input value="'+esc(x.solicitante)+'" onchange="editField(\'solicitante\',this.value)"></div><div><label>Teléfono</label><input value="'+esc(x.telefono)+'" onchange="editField(\'telefono\',this.value)"></div><div><label>Distrito</label><input value="'+esc(x.distrito)+'" disabled></div><div><label>Tipo</label><input value="'+esc(x.tipo)+'" disabled></div><div class="full"><label>Intervención</label><input value="'+esc(x.intervencion)+'" disabled></div></div></div><div class="card"><h3>Estado del flujo</h3><p>'+badge(x.status)+'</p><div class="timeline">'+x.events.slice(0,6).map(e=>'<div class="event"><b>'+esc(e.t)+'</b><small>'+esc(e.d)+'</small></div>').join('')+'</div></div></div>'}
function acta(x){let a=x.acta||{};return '<div class="card"><div class="between"><h3>Acta de inspección</h3>'+badge(x.status)+'</div><div class="notice">El Técnico puede completar y guardar el Acta. Los datos quedan persistentes en este navegador.</div><div class="formgrid"><div><label>Fecha</label><input id="a_fecha" type="date" value="'+esc(a.fecha||new Date().toISOString().slice(0,10))+'"></div><div><label>Hora inicio</label><input id="a_hi" type="time" value="'+esc(a.hi||'08:00')+'"></div><div><label>Hora fin</label><input id="a_hf" type="time" value="'+esc(a.hf||'09:30')+'"></div><div><label>Distrito</label><input id="a_dist" value="'+esc(x.distrito)+'"></div><div><label>Técnico</label><input id="a_tec" value="'+esc(x.tecnico)+'"></div><div><label>Tipo de intervención</label><input id="a_tipo" value="'+esc(x.intervencion)+'"></div><div class="full"><label>Descripción de la inspección</label><textarea id="a_desc">'+esc(a.desc||'')+'</textarea></div><div><label>Dirección / localización</label><input id="a_dir" value="'+esc(a.dir||x.direccion)+'"></div><div><label>Latitud</label><input id="a_lat" value="'+esc(a.lat||x.lat)+'"></div><div><label>Longitud</label><input id="a_lon" value="'+esc(a.lon||x.lon)+'"></div><div class="full"><label>Hallazgos</label><textarea id="a_hall">'+esc(a.hall||'')+'</textarea></div><div class="full"><label>Recomendación técnica</label><textarea id="a_rec">'+esc(a.rec||'')+'</textarea></div><div class="full"><label>Observaciones</label><textarea id="a_obs">'+esc(a.obs||'')+'</textarea></div></div><div class="actions" style="margin-top:14px"><button class="primary" onclick="saveActa()">Guardar Acta</button><button class="secondary" onclick="captureGeo()">Capturar ubicación</button><button class="secondary" onclick="tab='arboles';render()">Gestionar árboles</button><button class="secondary" onclick="tab='evidencias';render()">Evidencias</button></div></div>'}
function saveActa(){let x=current();x.acta={fecha:g('a_fecha'),hi:g('a_hi'),hf:g('a_hf'),dist:g('a_dist'),tec:g('a_tec'),tipo:g('a_tipo'),desc:g('a_desc'),dir:g('a_dir'),lat:g('a_lat'),lon:g('a_lon'),hall:g('a_hall'),rec:g('a_rec'),obs:g('a_obs')};x.status='Acta completada';event(x,'Acta guardada','Acta actualizada y persistida');save();toast('Acta guardada correctamente');render()}
function g(id){return document.getElementById(id)?.value||''}
function editField(k,v){current()[k]=v;save();toast('Dato guardado')}
function captureGeo(){if(!navigator.geolocation){toast('Geolocalización no disponible',false);return}navigator.geolocation.getCurrentPosition(p=>{document.getElementById('a_lat').value=p.coords.latitude.toFixed(6);document.getElementById('a_lon').value=p.coords.longitude.toFixed(6);toast('Ubicación capturada; pulse Guardar Acta para persistir')},()=>toast('No se pudo obtener ubicación',false))}
function arboles(x){return '<div class="card"><div class="between"><h3>Inventario de árboles</h3><button class="primary" onclick="addTree()">+ Agregar árbol</button></div><table><thead><tr><th>#</th><th>Especie</th><th>Altura m</th><th>Diámetro cm</th><th>Estado</th><th>Recomendación</th><th>Acción</th></tr></thead><tbody>'+(x.arboles.length?x.arboles.map(t=>'<tr><td>'+t.id+'</td><td>'+esc(t.especie)+'</td><td>'+esc(t.altura)+'</td><td>'+esc(t.diametro)+'</td><td>'+esc(t.estado)+'</td><td>'+esc(t.recomendacion)+'</td><td><button class="danger" onclick="delTree('+t.id+')">Eliminar</button></td></tr>').join(''):'<tr><td colspan="7">No hay árboles registrados.</td></tr>')+'</tbody></table></div>'}
function addTree(){let x=current(),t={id:Date.now(),especie:prompt('Especie','Árbol'),altura:prompt('Altura (m)','10'),diametro:prompt('Diámetro (cm)','30'),estado:prompt('Estado','Bueno'),recomendacion:prompt('Recomendación','Poda'),accion:prompt('Acción','Evaluar')};if(!t.especie)return;x.arboles.push(t);event(x,'Árbol agregado','Registro #'+t.id);save();toast('Árbol guardado');render()}
function delTree(id){let x=current();x.arboles=x.arboles.filter(t=>t.id!==id);event(x,'Árbol eliminado','Registro #'+id);save();toast('Árbol eliminado');render()}
function evidencias(x){return '<div class="card"><div class="between"><h3>Evidencias fotográficas</h3><label class="primary" style="cursor:pointer">+ Agregar fotografía<input id="photo" type="file" accept="image/*" hidden onchange="addPhoto(this)"></label></div><div style="height:10px"></div><div class="grid2">'+(x.evidencias.length?x.evidencias.map((e,i)=>'<div class="card"><img src="'+e.data+'" style="width:100%;max-height:260px;object-fit:contain;border-radius:7px"><small>'+esc(e.name)+' · '+esc(e.date)+'</small></div>').join(''):'<div class="filebox full">Aún no hay evidencias. Seleccione una fotografía para almacenarla en la prueba.</div>')+'</div></div>'}
function addPhoto(inp){let f=inp.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{let x=current();x.evidencias.push({name:f.name,date:new Date().toLocaleString(),data:rd.result});event(x,'Evidencia agregada',f.name);save();toast('Evidencia guardada');render()};rd.readAsDataURL(f)}
function informe(x){let i=x.informe||{};let ready=!!x.acta?.fecha;return '<div class="card"><h3>Informe técnico</h3><div class="notice '+(ready?'success':'warning')+'">'+(ready?'Acta disponible para elaborar el informe.':'Debe guardar el Acta antes del Informe.')+'</div><div class="formgrid"><div class="full"><label>Resultado</label><textarea id="i_res">'+esc(i.res||'')+'</textarea></div><div class="full"><label>Recomendación</label><textarea id="i_rec">'+esc(i.rec||'')+'</textarea></div><div class="full"><label>Observaciones</label><textarea id="i_obs">'+esc(i.obs||'')+'</textarea></div></div><div class="actions" style="margin-top:14px"><button class="primary" '+(!ready?'disabled':'')+' onclick="saveInforme()">Guardar Informe</button><button class="primary" onclick="sendValidation()" '+(!ready?'disabled':'')+'>Enviar a validación</button></div></div>'}
function saveInforme(){let x=current();if(!x.acta?.fecha){toast('Primero debe guardar el Acta',false);return}x.informe={res:g('i_res'),rec:g('i_rec'),obs:g('i_obs'),fecha:new Date().toISOString()};x.status='Informe técnico completado';event(x,'Informe guardado','Informe técnico persistido');save();toast('Informe guardado');render()}
function sendValidation(){let x=current();if(!x.acta?.fecha||!x.informe?.fecha){toast('Complete Acta e Informe antes de validar',false);return}x.status='En validación del Gerente';event(x,'Enviado a validación','Acta + Informe remitidos al Gerente');save();toast('Expediente enviado a validación');render()}
function traza(x){return '<div class="card"><h3>Trazabilidad</h3><div class="timeline">'+x.events.map(e=>'<div class="event"><b>'+esc(e.t)+'</b><small>'+esc(e.d)+'</small></div>').join('')+'</div></div>'}
function economico(x){if(role!=='GERENTE')return '<div class="card"><h3>Acceso restringido</h3><p>Las tasas, recibos y permisos corresponden al Gerente.</p></div>';if(!x.validacion?.ok)return '<div class="card"><h3>Permiso / Tasas / Recibo</h3><div class="warning notice">El bloque económico aparece después del Visto Bueno del Gerente.</div></div>';let rates=rate(x),t=x.tramite;return '<div class="grid2"><div class="card"><h3>Visto Bueno</h3><p>'+badge('Visto Bueno Gerente')+'</p><div class="notice success">Acta e Informe validados. Ya puede continuar el trámite económico.</div><div class="formgrid"><div><label>Concepto</label><select id="concept"><option value="permiso_tala">Permiso de tala</option><option value="permiso_poda">Permiso de poda</option><option value="servicio_tala">Servicio de tala</option><option value="servicio_poda">Servicio de poda</option><option value="trasplante">Trasplante</option></select></div><div><label>Cantidad de árboles</label><input id="qty" type="number" min="1" value="'+Math.max(1,x.arboles.length||1)+'"></div><div><label>Inspección</label><input value="$'+rates.inspeccion.toFixed(2)+' · 1 unidad" disabled></div></div><div class="actions" style="margin-top:12px"><button class="primary" onclick="calculate()">Calcular tasas</button></div><div id="calc" style="margin-top:12px">'+(t?renderCalc(t):'')+'</div></div><div class="card"><h3>Documentos</h3>'+(t?'<p><b>Recibo:</b> '+esc(t.recibo.numero)+' · $'+t.recibo.total.toFixed(2)+'</p><p><b>Permiso/Servicio:</b> '+esc(t.documento.numero)+'</p><div class="actions"><button class="primary" onclick="openDoc(\'recibo\')">Ver recibo</button><button class="secondary" onclick="openDoc(\'documento\')">Ver documento</button></div>':'<p class="muted">Aún no se han generado documentos.</p>')+'</div></div>'}
function rate(x){let d=x.distrito;return {inspeccion:d==='Huizúcar'?50:d==='San José Villanueva'?10:d==='Antiguo Cuscatlán'||d==='Zaragoza'?10:40,permiso_tala:d==='Nuevo Cuscatlán'?230:d==='San José Villanueva'?25:d==='Huizúcar'?15:200,permiso_poda:d==='Nuevo Cuscatlán'?75:d==='Huizúcar'?10:10,trasplante:d==='Nuevo Cuscatlán'?35:0,servicio_tala:d==='Antiguo Cuscatlán'?205:0,servicio_poda:d==='Antiguo Cuscatlán'?150:0}}
function calculate(){let x=current(),r=rate(x),c=g('concept'),q=Number(g('qty')||1),price=r[c]||0,sub=price*q,total=sub+r.inspeccion;x.tramite={concept:c,qty:q,unit:price,inspeccion:r.inspeccion,subtotal:sub,total:total,recibo:null,documento:null};event(x,'Cálculo realizado','Subtotal $'+sub.toFixed(2)+' + inspección $'+r.inspeccion.toFixed(2)+' = $'+total.toFixed(2));save();document.getElementById('calc').innerHTML=renderCalc(x.tramite);toast('Cálculo persistido')}
function renderCalc(t){return '<div class="notice success"><b>Resultado:</b> '+esc(t.concept)+' · '+t.qty+' × $'+t.unit.toFixed(2)+' = $'+t.subtotal.toFixed(2)+'<br>Inspección: 1 × $'+t.inspeccion.toFixed(2)+'<br><b>Total: $'+t.total.toFixed(2)+'</b><br><br><button class="primary" onclick="generateDocs()">Generar recibo y documento real</button></div>'}
function generateDocs(){let x=current();if(!x.tramite){toast('Primero calcule las tasas',false);return}let n='REC-'+new Date().getFullYear()+'-'+String(db.seq++).padStart(5,'0'),d='DOC-'+new Date().getFullYear()+'-'+String(db.seq++).padStart(5,'0');x.tramite.recibo={numero:n,date:new Date().toLocaleString(),total:x.tramite.total};x.tramite.documento={numero:d,date:new Date().toLocaleString(),tipo:x.tramite.concept};x.status='Permiso/Servicio generado';event(x,'Recibo generado',n+' · $'+x.tramite.total.toFixed(2));event(x,'Documento generado',d);save();downloadDocument(x,'recibo');downloadDocument(x,'documento');toast('Recibo y documento generados y guardados');render()}
function downloadDocument(x,type){let t=x.tramite;let title=type==='recibo'?'RECIBO OFICIAL DE PAGO':'PERMISO / SERVICIO AMBIENTAL';let num=type==='recibo'?t.recibo.numero:t.documento.numero;let body=type==='recibo'?'<p><b>Recibo:</b> '+num+'</p><p><b>Expediente:</b> '+x.id+'</p><p><b>Solicitante:</b> '+x.solicitante+'</p><p><b>Distrito:</b> '+x.distrito+'</p><hr><p>'+t.qty+' × $'+t.unit.toFixed(2)+' = $'+t.subtotal.toFixed(2)+'</p><p>Inspección: 1 × $'+t.inspeccion.toFixed(2)+'</p><h2>Total: $'+t.total.toFixed(2)+'</h2>':'<p><b>Documento:</b> '+num+'</p><p><b>Expediente:</b> '+x.id+'</p><p><b>Solicitante:</b> '+x.solicitante+'</p><p><b>Distrito:</b> '+x.distrito+'</p><p><b>Actuación:</b> '+t.concept+'</p><p>Documento generado después del Visto Bueno del Gerente.</p>';let h='<!doctype html><html><head><meta charset="utf-8"><title>'+title+'</title><style>body{font-family:Arial;margin:50px;color:#172033}h1{border-bottom:3px solid #d81b82;padding-bottom:12px}.box{border:1px solid #ccc;padding:24px}</style></head><body><h1>ALCALDÍA MUNICIPAL DE LA LIBERTAD ESTE</h1><h2>'+title+'</h2><div class="box">'+body+'</div><p>Documento de prueba funcional · generado desde expediente '+x.id+'</p></body></html>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download=num+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function openDoc(type){let x=current();if(!x.tramite)return;downloadDocument(x,type);toast('Documento abierto/descargado')}
function validate(){let x=current();if(role!=='GERENTE'){toast('Solo Gerente',false);return}if(x.status!=='En validación del Gerente'){toast('El expediente no está pendiente de validación',false);return}x.validacion={ok:true,fecha:new Date().toLocaleString(),responsable:'Gerente Ambiental'};x.status='Visto Bueno Gerente';event(x,'Visto Bueno','Validación aprobada por Gerente');save();toast('Visto Bueno guardado');render()}
function newRequest(){let id='EXP-2026-'+String(++db.seq).padStart(4,'0');let x={id,solicitante:prompt('Solicitante','Nuevo solicitante')||'Nuevo solicitante',telefono:'',distrito:prompt('Distrito','Antiguo Cuscatlán')||'Antiguo Cuscatlán',tipo:prompt('Tipo de solicitud','Poda/Tala')||'Poda/Tala',intervencion:'Inspección',direccion:'',lat:'',lon:'',status:'Asignada a técnico',tecnico:'Técnico Ambiental 01',acta:{},informe:{},arboles:[],evidencias:[],validacion:{},tramite:null,events:[]};db.expedientes.push(x);event(x,'Solicitud creada','Expediente creado para prueba');save();eid=id;section='expedientes';toast('Solicitud creada y persistida');render()}
function resetDemo(){if(confirm('¿Restablecer todos los datos de la prueba?')){db=JSON.parse(JSON.stringify(seed));save();eid=db.expedientes[0].id;toast('Prueba restablecida');render()}}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='LLE_PRUEBA_R1_DATOS.json';a.click()}
function managerValidationButton(){return role==='GERENTE'&&current().status==='En validación del Gerente'?'<div class="card"><h3>Validación pendiente</h3><p>Revise Acta e Informe antes de aprobar.</p><button class="primary" onclick="validate()">✓ Dar Visto Bueno</button></div>':''}
const oldTabContent=tabContent;tabContent=function(x){let c=oldTabContent(x);return (tab==='resumen'&&role==='GERENTE'?managerValidationButton():'')+c}
render();
</script>
</body>
</html>
